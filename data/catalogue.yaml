# Lines that carry no information about any fault. The generator mixes them into log excerpts.
noise:
  - "healthcheck ok"
  - "config reload: no changes"
  - "gc pause 41ms"
  - "metrics flush job finished rows=1280"
  - "cache hit ratio=0.93"
  - "connection keepalive sent peers=12"
  - "scheduled task heartbeat ok"
  - "request log rotated"
